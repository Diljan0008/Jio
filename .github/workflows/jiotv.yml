name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *' # ਹਰ 2 ਘੰਟੇ ਵਿੱਚ ਆਪਣੇ ਆਪ ਚੱਲੇਗਾ
  workflow_dispatch:
    inputs:
      Enter_your_OTP:
        description: 'आपके WhatsApp पर आया हुआ OTP यहाँ भरें (पहली बार इसे खाली छोड़ दें)'
        required: false
        default: ''

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Handle Login or Run Auto-Server
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          
          if [ -z "${{ github.event.inputs.Enter_your_OTP }}" ]; then
            echo "=== 📥 WhatsApp પર OTP भेजा जा रहा है ==="
            # '2' ਨੰਬਰ ਦਬਾਉਣ ਨਾਲ WhatsApp ਆਪਸ਼ਨ ਚੁਣਿਆ ਜਾਵੇਗਾ
            printf "6284293467\n2\n" | ./jiotv_go login otp || true
            echo "======================================"
            echo "👉 ਵੀਰ ਹੁਣ ਆਪਣਾ WhatsApp ਚੈੱਕ ਕਰੋ, ਜਿਓ ਵੱਲੋਂ OTP ਆ ਗਿਆ ਹੋਵੇਗਾ!"
            echo "👉 ਹੁਣ ਦੁਬਾਰਾ Run Workflow ਤੇ ਕਲਿੱਕ ਕਰੋ ਅਤੇ Enter your OTP ਵਾਲੇ ਡੱਬੇ ਵਿੱਚ ਉਹਨੂੰ ਭਰੋ।"
          else
            echo "=== 🔑 लॉगिन वेरिफाई किया जा रहा है ==="
            printf "6284293467\n${{ github.event.inputs.Enter_your_OTP }}\n" | ./jiotv_go login otp
            
            echo "=== 💾 आपका नया टोकन नीचे है, इसे稳 कॉपी करें ==="
            cat ~/.jiotv_go/store_v4.toml
          fi
          
        else
          echo "=== 🔄 ऑटोमैटिक सर्वर बैकग्राउंड में चल रहा है ==="
          mkdir -p ~/.jiotv_go
          echo "${{ secrets.JIOTV_CREDENTIALS }}" > ~/.jiotv_go/store_v4.toml
          
          ./jiotv_go serve &
          sleep 20
          
          curl -s http://localhost:5001/playlist.m3u > playlist.m3u
          curl -s http://localhost:5001/epg.xml > epg.xml
          echo "=== ✔️ प्लेलिस्ट अपडेट हो गई है ==="
        fi

    - name: Deploy Static Files to GitHub Pages
      if: ${{ github.event.inputs.Enter_your_OTP == '' && github.event_name == 'schedule' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
