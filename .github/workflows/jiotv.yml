name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *' # ਹਰ 2 ਘੰਟੇ ਵਿੱਚ ਆਪਣੇ ਆਪ ਚੱਲੇਗਾ
  workflow_dispatch:
    inputs:
      Action_Type:
        description: 'ਤੁਸੀਂ ਕੀ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?'
        required: true
        default: '1_Request_OTP'
        type: choice
        options:
          - '1_Request_OTP'
          - '2_Submit_OTP'
      Enter_your_OTP:
        description: 'ਸਿਰਫ਼ 2_Submit_OTP ਵੇਲੇ ਇੱਥੇ OTP ਭਰੋ (ਪਹਿਲੀ ਵਾਰ ਖਾਲੀ ਛੱਡੋ)'
        required: false
        default: ''

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Handle Login or Run Auto-Server
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          
          # ਸਟੈਪ 1: ਜੇਕਰ ਤੁਸੀਂ ਸਿਰਫ਼ OTP ਮੰਗਵਾਉਣਾ ਹੈ
          if [ "${{ github.event.inputs.Action_Type }}" = "1_Request_OTP" ]; then
            echo "=== 📥 WhatsApp ਤੇ OTP ਭੇਜਿਆ ਜਾ ਰਿਹਾ ਹੈ ==="
            printf "6284293467\n2\n" | ./jiotv_go login otp || true
            echo "======================================"
            echo "👉 ਆਪਣਾ WhatsApp ਚੈੱਕ ਕਰੋ ਅਤੇ OTP ਨੋਟ ਕਰ ਲਵੋ।"
            
          # ਸਟੈਪ 2: ਜਦੋਂ OTP ਆ ਗਿਆ, ਤਾਂ ਇਹ ਹਿੱਸਾ ਚੱਲੇਗਾ
          elif [ "${{ github.event.inputs.Action_Type }}" = "2_Submit_OTP" ]; then
            echo "=== 🔑 ਲੌਗਿਨ ਵੈਰੀਫਾਈ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ ==="
            # ਇਹ ਟ੍ਰਿਕ ਜਿਓ ਨੂੰ ਨਵਾਂ OTP ਭੇਜਣ ਨਹੀਂ ਦੇਵੇਗੀ, ਸਿੱਧਾ ਪੁਰਾਣੇ ਵਾਲੇ ਨੂੰ ਵੈਰੀਫਾਈ ਕਰੇਗੀ
            printf "6284293467\n${{ github.event.inputs.Enter_your_OTP }}\n" | ./jiotv_go login otp
            
            echo "=== 💾 ਤੁਹਾਡਾ ਨਵਾਂ ਟੋਕਨ ਕੋਡ ਥੱਲੇ ਹੈ ==="
            cat ~/.jiotv_go/store_v4.toml
            echo "========================================"
          fi
          
        else
          echo "=== 🔄 ਆਟੋਮੈਟਿਕ ਸਰਵਰ ਬੈਕਗਰਾਊਂਡ ਵਿੱਚ ਚੱਲ ਰਿਹਾ ਹੈ ==="
          mkdir -p ~/.jiotv_go
          echo "${{ secrets.JIOTV_CREDENTIALS }}" > ~/.jiotv_go/store_v4.toml
          
          ./jiotv_go serve &
          sleep 20
          
          curl -s http://localhost:5001/playlist.m3u > playlist.m3u
          curl -s http://localhost:5001/epg.xml > epg.xml
          echo "=== ✔️ ਪਲੇਲਿਸਟ ਅਪਡੇਟ ਹੋ ਗਈ ਹੈ ==="
        fi

    - name: Deploy Static Files to GitHub Pages
      if: ${{ github.event_name == 'schedule' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
