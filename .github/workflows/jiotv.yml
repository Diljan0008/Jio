name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Run Server with Phone Spoofing
      run: |
        echo "=== 🔄 ਜਿਓ ਸਰਵਰ ਨੂੰ ਚਕਮਾ ਦੇ ਕੇ ਸਟਾਰਟ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ ==="
        mkdir -p ~/.jiotv_go
        echo "${{ secrets.JIOTV_CREDENTIALS }}" > ~/.jiotv_go/config.toml
        echo "${{ secrets.JIOTV_CREDENTIALS }}" > ~/.jiotv_go/store_v4.toml
        
        # ਸਰਵਰ ਨੂੰ ਪਬਲਿਕ ਅਤੇ ਬਾਈਪਾਸ ਮੋਡ ਵਿੱਚ ਚਲਾਉਣਾ
        ./jiotv_go serve --public &
        sleep 20
        
        # ਫ਼ੋਨ ਦਾ ਭੇਸ ਬਣਾ ਕੇ (User-Agent ਲਗਾ ਕੇ) ਪਲੇਲਿਸਟ ਖਿੱਚਣੀ
        curl -s -A "JioTV/3.2.5 (Linux; Android 11)" http://localhost:5001/playlist.m3u > raw_playlist.m3u
        curl -s -A "JioTV/3.2.5 (Linux; Android 11)" http://localhost:5001/epg.xml > epg.xml
        
        # ਲੋਕਲਹੋਸਟ ਦੇ ਲਿੰਕਾਂ ਨੂੰ ਪਬਲਿਕ ਕਲਾਊਡ ਲਿੰਕਸ ਵਿੱਚ ਬਦਲਣਾ
        sed 's|http://localhost:5001|https://jiotvgo.strem.ovh|g' raw_playlist.m3u > playlist.m3u
        rm raw_playlist.m3u
        
        echo "=== ✔️ ਜਿਓ ਨੂੰ ਪਤਾ ਲੱਗੇ ਬਿਨਾਂ ਪਲੇਲਿਸਟ ਤਿਆਰ ਹੈ ==="

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
