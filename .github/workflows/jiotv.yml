name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Run Auto-Server & Fetch Playlist
      env:
        JIOTV_CONFIG: ${{ secrets.JIOTV_CREDENTIALS }}
      run: |
        echo "=== 🔄 ਸਰਵਰ ਸਟਾਰਟ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ ==="
        mkdir -p ~/.jiotv_go
        
        # ਸਟਾਰਸ (***) ਵਾਲੇ ਬੱਗ ਨੂੰ ਬਾਈਪਾਸ ਕਰਨ ਲਈ ਸਿੱਧਾ ਇਨਵਾਇਰਨਮੈਂਟ ਵੇਰੀਏਬਲ ਤੋਂ ਫਾਈਲ ਬਣਾਓ
        cat << 'EOF' > ~/.jiotv_go/store_v4.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        ./jiotv_go serve &
        sleep 20
        
        curl -s http://localhost:5001/playlist.m3u > playlist.m3u
        curl -s http://localhost:5001/epg.xml > epg.xml
        echo "=== ✔️ ਪਲੇਲਿਸਟ ਅਤੇ EPG ਸਫਲਤਾਪੂਰਵਕ ਅਪਡੇਟ ਹੋ ਗਏ ਨੇ ==="

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
