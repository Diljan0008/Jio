name: JioTV 24/7 VPN Bypass Server

on:
  schedule:
    - cron: '0 */2 * * *' # ਹਰ 2 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਚੱਲੇਗਾ
  workflow_dispatch:

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install VPN and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openvpn mtr curl
        
    - name: Fetch Free VPN Config & Connect
      run: |
        # 🌐 ਫ੍ਰੀ ਅਤੇ ਸੁਰੱਖਿਅਤ VPN ਕਨੈਕਟ ਕਰਨਾ ਤਾਂ ਜੋ Jio IP ਬਲੌਕ ਨਾ ਕਰ ਸਕੇ
        curl -s -o vpn_config.ovpn https://raw.githubusercontent.com/wuddz-devs/openvpn-configs/master/free/us.ovpn
        sudo openvpn --config vpn_config.ovpn &
        echo "=== ⏳ VPN ਕਨੈਕਟ ਹੋਣ ਦੀ ਉਡੀਕ ਕੀਤੀ ਜਾ ਰਹੀ ਹੈ ==="
        sleep 15

    - name: Install and Run JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go
        
        mkdir -p ~/.jiotv_go
        
        # 🔒 ਤੁਹਾਡੇ ਸੁਰੱਖਿਅਤ ਟੋਕਨ ਨੂੰ ਫਾਈਲ ਵਿੱਚ ਲਿਖਣਾ
        cat << 'EOF' > ~/.jiotv_go/config.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        cat << 'EOF' > ~/.jiotv_go/store_v4.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        # ਬੈਕਗ੍ਰਾਊਂਡ ਵਿੱਚ ਜਿਓ ਸਰਵਰ ਸਟਾਰਟ ਕਰਨਾ
        ./jiotv_go serve &
        sleep 20
        
        # 👑 VPN ਦੇ ਰਾਹੀਂ ਸੁਰੱਖਿਅਤ ਤਰੀਕੇ ਨਾਲ ਪਲੇਲਿਸਟ ਖਿੱਚਣਾ
        curl -s http://localhost:5001/playlist.m3u > raw_playlist.m3u
        curl -s http://localhost:5001/epg.xml > epg.xml
        
        # ਲਿੰਕਸ ਨੂੰ ਸਿੱਧਾ ਪਬਲیک ਸਟ੍ਰੀਮ ਹੋਸਟ ਨਾਲ ਰੀਡਾਇਰੈਕਟ ਕਰਨਾ
        sed 's|http://localhost:5001|https://jiotvgo.strem.ovh|g' raw_playlist.m3u > playlist.m3u
        rm raw_playlist.m3u
        echo "=== ✔️ ਬਾਈਪਾਸ ਪਲੇਲਿਸਟ ਆਟੋਮੈਟਿਕ ਤਿਆਰ ਹੈ ==="

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
