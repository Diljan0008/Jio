name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Run Auto-Server & Fetch Playlist
      run: |
        echo "=== 🔄 ਸਰਵਰ ਸਟਾਰਟ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ ==="
        mkdir -p ~/.jiotv_go
        echo "${{ secrets.JIOTV_CREDENTIALS }}" > ~/.jiotv_go/store_v4.toml
        
        ./jiotv_go serve &
        sleep 20
        
        # ਪਲੇਲਿਸਟ ਡਾਊਨਲੋਡ ਕਰੋ ਅਤੇ ਲੋਕਲਹੋਸਟ (localhost) ਨੂੰ ਜਿਓ ਦੇ ਲਾਈਵ ਸਟ੍ਰੀਮ ਲਿੰਕਸ ਨਾਲ ਬਦਲੋ
        curl -s http://localhost:5001/playlist.m3u | sed 's|http://localhost:5001|https://jiotvgo.strem.ovh|g' > playlist.m3u
        curl -s http://localhost:5001/epg.xml > epg.xml
        echo "=== ✔️ ਪਲੇਲਿਸਟ ਫਿਕਸ ਹੋ ਕੇ ਅਪਡੇਟ ਹੋ ਗਈ ਹੈ ==="

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
