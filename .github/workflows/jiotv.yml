name: JioTV 24/7 Automatic Server

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Run Server with Safe Token Handling
      run: |
        echo "=== 🔄 ਸਰਵਰ ਸੈੱਟਅੱਪ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ ==="
        mkdir -p ~/.jiotv_go
        
        # 🔒 ਟੋਕਨ ਨੂੰ ਬਿਨਾਂ ਖਰਾਬ ਕੀਤੇ ਸੁਰੱਖਿਅਤ ਤਰੀਕੇ ਨਾਲ ਫਾਈਲ ਵਿੱਚ ਲਿਖਣਾ
        cat << 'EOF' > ~/.jiotv_go/config.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        cat << 'EOF' > ~/.jiotv_go/store_v4.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        # ਸਰਵਰ ਸਟਾਰਟ ਕਰਨਾ
        ./jiotv_go serve --public &
        sleep 20
        
        # ਪਲੇਲਿਸਟ ਅਤੇ ਈਪੀਜੀ ਡਾਊਨਲੋਡ ਕਰਨੀ (Phone User-Agent ਦੇ ਨਾਲ)
        curl -s -A "JioTV/3.2.5 (Linux; Android 11)" http://localhost:5001/playlist.m3u > raw_playlist.m3u
        curl -s -A "JioTV/3.2.5 (Linux; Android 11)" http://localhost:5001/epg.xml > epg.xml
        
        # ਲਿੰਕਸ ਨੂੰ ਪਬਲਿਕ ਸਰਵਰ ਨਾਲ ਬਦਲਣਾ
        sed 's|http://localhost:5001|https://jiotvgo.strem.ovh|g' raw_playlist.m3u > playlist.m3u
        rm raw_playlist.m3u
        
        echo "=== ✔️ ਪਲੇਲਿਸਟ ਬਿਨਾਂ ਕਿਸੇ ਏਰਰ ਦੇ ਤਿਆਰ ਹੈ ==="

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
