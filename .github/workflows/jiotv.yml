name: JioTV Go 24/7 Server

on:
  schedule:
    - cron: '0 */2 * * *' # ਹਰ 2 ਘੰਟੇ ਬਾਅਦ ਆਟੋ-ਰਿਫ੍ਰੈਸ਼
  workflow_dispatch: # ਮੈਨੂਅਲ ਸਟਾਰਟ ਕਰਨ ਲਈ

jobs:
  run-jiotv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Restore JioTV Login Credentials
      env:
        CREDENTIALS_DATA: ${{ secrets.JIOTV_CREDENTIALS }}
      run: |
        # ਪਹਿਲਾਂ ਫੋਲਡਰ ਬਣਾਓ
        mkdir -p ~/.jiotv_go
        
        # ਫਾਈਲ ਨੂੰ ਸਹੀ ਫਾਰਮੈਟ ਵਿੱਚ ਸੇਵ ਕਰੋ
        cat << 'EOF' > ~/.jiotv_go/store_v4.toml
        ${{ secrets.JIOTV_CREDENTIALS }}
        EOF
        
        # ਚੈੱਕ ਕਰੋ ਕਿ ਫਾਈਲ ਖਾਲੀ ਤਾਂ ਨਹੀਂ ਰਹਿ ਗਈ
        if [ ! -s ~/.jiotv_go/store_v4.toml ]; then
          echo "Error: Credentials file is empty!"
          exit 1
        fi

    - name: Run Server & Generate Static Files
      run: |
        # ਸਰਵਰ ਨੂੰ ਚਲਾਓ
        ./jiotv_go serve &
        
        # ਸਰਵਰ ਨੂੰ ਸਟਾਰਟ ਹੋਣ ਲਈ 20 ਸੈਕਿੰਡ ਦਾ ਟਾਈਮ ਦਿਓ
        sleep 20
        
        # ਚੈਨਲ ਲਿਸਟ ਡਾਊਨਲੋਡ ਕਰੋ
        curl -s http://localhost:5000/playlist.m3u > playlist.m3u
        curl -s http://localhost:5000/epg.xml > epg.xml

    - name: Deploy Static Files to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
        target-folder: .
