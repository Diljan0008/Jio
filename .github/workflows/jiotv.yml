name: JioTV Live Debug Login

on:
  workflow_dispatch:

jobs:
  debug-login:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JioTV Go
      run: |
        curl -L -o jiotv_go https://github.com/JioTV-Go/jiotv_go/releases/latest/download/jiotv_go-linux-amd64
        chmod +x jiotv_go

    - name: Setup Live Terminal
      uses: mxschmitt/action-tmate@v3
